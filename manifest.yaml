# =====================================================================
# MANIFIESTO DE DATASET: C-MAPSS FD001 (NASA Turbofan Degradation)
# Gemelo Digital para Mantenimiento Predictivo - Fase 1
# =====================================================================

name: cmapss_fd001
version: "1.0"
source: "NASA Prognostics Center of Excellence (PCoE)"
dataset_type: simulation
domain: aerospace_turbofan

# ---------------------------------------------------------------------
# Definición del Problema de Machine Learning
# ---------------------------------------------------------------------
problem_type: rul_regression
target:
  name: rul
  description: "Remaining Useful Life (Vida Útil Restante en ciclos de vuelo)"
  rul_cap: 125
  cap_rationale: "En fases tempranas de vida útil la degradación no es distinguible en las señales; fijar un tope lineal estabiliza el entrenamiento y evita predicciones irreales."

# ---------------------------------------------------------------------
# Contrato del Esquema Canónico
# ---------------------------------------------------------------------
canonical_schema:
  asset_id: "Identificador único y estable del motor (ej: cmapss_1)"
  sequence_no: "Ciclo operacional (entero creciente sin saltos)"
  observed_at: "Marca temporal sintética (base fija + ciclo en minutos)"
  dataset_id: "Nombre del dataset de origen (cmapss_fd001)"
  modality: "timeseries"
  media_ref: null
  features: "Diccionario de parámetros operacionales y lecturas de sensores"
  target: "RUL en ciclos con tope 125"
  split_hint: "train | test"
  quality_flags: "OK | anomalia"

# ---------------------------------------------------------------------
# Mapeo y Significado Físico de las Variables (Features)
# ---------------------------------------------------------------------
operational_settings:
  setting1: "Altitud de vuelo (Flight Altitude) [kft]"
  setting2: "Número Mach de velocidad [Mach]"
  setting3: "Ángulo del acelerador (Throttle Resolver Angle - TRA) [°]"

sensors:
  s1:  "Temperatura total en la entrada del ventilador (T2) [°R]"
  s2:  "Temperatura total a la salida del LPC (T24) [°R]"
  s3:  "Temperatura total a la salida del HPC (T30) [°R]"
  s4:  "Temperatura total a la salida del LPT (T50) [°R]"
  s5:  "Presión en la entrada del ventilador (P2) [psia]"
  s6:  "Presión total en el ducto de bypass (P15) [psia]"
  s7:  "Presión total a la salida del HPC (P30) [psia]"
  s8:  "Velocidad física del ventilador (Nf) [rpm]"
  s9:  "Velocidad física del núcleo (Nc) [rpm]"
  s10: "Relación de presión del motor (epr)"
  s11: "Presión estática a la salida del HPC (Ps30) [psia]"
  s12: "Relación entre flujo de combustible y Ps30 (phi) [pps/psia]"
  s13: "Velocidad corregida del ventilador (NRf) [rpm]"
  s14: "Velocidad corregida del núcleo (NRc) [rpm]"
  s15: "Relación de bypass (BPR)"
  s16: "Relación aire-combustible (farB)"
  s17: "Entalpía purgada (htBleed)"
  s18: "Demanda de velocidad del ventilador (PCNfR_dmd) [rpm]"
  s19: "Demanda de velocidad corregida del núcleo (W31_dmd) [rpm]"
  s20: "Flujo de purga de refrigerante de HPT (W32) [lbm/s]"
  s21: "Flujo de purga de refrigerante de LPT (W33) [lbm/s]"

# ---------------------------------------------------------------------
# Reglas de Validación de Calidad
# ---------------------------------------------------------------------
quality_rules:
  no_nulls: true
  monotonic_decreasing_rul: true
  rul_upper_limit: 125
  sequence_strict_order: true
